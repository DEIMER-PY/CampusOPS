openapi: 3.1.0
info:
  title: CampusFlow API
  version: 0.3.0
  description: Recursos, préstamos, incidencias con Groq, coordinación inter-área y WebSocket nativo en tiempo real.
servers:
  - url: http://127.0.0.1:4000
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    Role:
      type: string
      enum: [ADMIN, FORMACION, COWORKING, MARKETING, SOPORTE, FULL_SERVICE, CLONAI, OPERATOR, CLIENT]
    CommunicationChannel:
      type: object
      required: [id, slug, name, isOfficial]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        isOfficial: { type: boolean }
        messageCount: { type: integer }
    ChannelMessage:
      type: object
      required: [id, channelId, senderId, content, priority, createdAt]
      properties:
        id: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        content: { type: string }
        priority: { type: string, enum: [NORMAL, URGENT] }
        createdAt: { type: string, format: date-time }
        sender:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string, nullable: true }
            email: { type: string, nullable: true }
            role: { $ref: '#/components/schemas/Role' }
    MemberProfile:
      type: object
      required: [id, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/Role' }
        areaLabel: { type: string }
    ReservationInput:
      type: object
      additionalProperties: false
      required: [spaceId, startAt, endAt, attendees, purpose]
      properties:
        spaceId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        attendees: { type: integer, minimum: 1 }
        purpose: { type: string, minLength: 3, maxLength: 300 }
paths:
  /health:
    get:
      summary: Liveness del proceso
      security: []
      responses:
        '200': { description: Proceso activo }
  /ready:
    get:
      summary: Comprueba conexión de base de datos
      security: []
      responses:
        '200': { description: Base accesible }
        '503': { description: Configuración pendiente o conexión fallida }
  /api/me:
    get:
      summary: Perfil del usuario autenticado y autorizado
      responses:
        '200': { description: Perfil con rol }
        '401': { description: Sesión ausente o inválida }
        '403': { description: Perfil no habilitado }
        '503': { description: Servicio no configurado o no disponible }
  /api/spaces:
    get:
      summary: Espacios persistidos; no implica disponibilidad horaria
      responses:
        '200': { description: Listado ordenado por nombre }
        '401': { description: Sesión ausente o inválida }
        '403': { description: Perfil no habilitado }
        '503': { description: Servicio no disponible }
  /api/reservations:
    get:
      summary: Últimas 50 reservas propias; operadores y administradores consultan todas
      responses:
        '200': { description: Reservas persistidas }
        '401': { description: Sesión ausente o inválida }
        '403': { description: Perfil no habilitado }
        '503': { description: Servicio no disponible }
    post:
      summary: Reserva para el usuario del token con validación transaccional
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationInput' }
      responses:
        '201': { description: Reserva y evento de auditoría persistidos }
        '400': { description: Entrada o intervalo inválido }
        '401': { description: Sesión ausente o inválida }
        '403': { description: Perfil no habilitado }
        '409': { description: Conflicto de aforo, estado u horario }
        '503': { description: Servicio no disponible }
  /api/admin/audit:
    get:
      summary: Últimos 50 eventos, solo rol ADMIN
      responses:
        '200': { description: Eventos auditables }
        '401': { description: Sesión ausente o inválida }
        '403': { description: Rol insuficiente o perfil no habilitado }
        '503': { description: Servicio no disponible }
  /api/resources:
    get:
      summary: Inventario con IDs de préstamos activos; no expone datos de sus propietarios
      responses:
        '200': { description: Datos persistidos }
        '400': { description: Entrada inválida }
        '401': { description: Sesión inválida }
        '403': { description: Rol insuficiente }
        '503': { description: Servicio no disponible }
    post:
      summary: Registrar equipo real (ADMIN u OPERATOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name, source, status]
              properties:
                code: { type: string, minLength: 2, maxLength: 50 }
                name: { type: string, minLength: 2, maxLength: 150 }
                source: { type: string, minLength: 3, maxLength: 300 }
                status: { type: string, enum: [AVAILABLE, DISABLED, MAINTENANCE] }
      responses:
        '201': { description: Recurso y auditoría creados }
        '400': { description: Entrada inválida }
        '401': { description: Sesión inválida }
        '403': { description: Requiere operador }
        '409': { description: Código duplicado }
  /api/resources/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Estado del recurso con bloqueo y auditoría (ADMIN u OPERATOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [AVAILABLE, DISABLED, MAINTENANCE] }
      responses:
        '200': { description: Datos persistidos }
        '400': { description: Entrada inválida }
        '401': { description: Sesión inválida }
        '403': { description: Rol insuficiente }
        '503': { description: Servicio no disponible }
  /api/spaces/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Estado del espacio con bloqueo y auditoría (ADMIN u OPERATOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [AVAILABLE, DISABLED, MAINTENANCE] }
      responses:
        '200': { description: Datos persistidos }
        '400': { description: Entrada inválida }
        '401': { description: Sesión inválida }
        '403': { description: Rol insuficiente }
        '503': { description: Servicio no disponible }
  /api/loans:
    get:
      summary: Últimos 50 préstamos propios; operadores consultan todos
      responses:
        '200': { description: Datos persistidos }
        '400': { description: Entrada inválida }
        '401': { description: Sesión inválida }
        '403': { description: Rol insuficiente }
        '503': { description: Servicio no disponible }
    post:
      summary: Solicitar préstamo propio con bloqueo y validación de estado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resourceId]
              properties:
                resourceId: { type: string, format: uuid }
      responses:
        '201': { description: Préstamo y auditoría creados }
        '400': { description: Entrada inválida }
        '401': { description: Sesión inválida }
        '409': { description: Recurso inhabilitado o ya prestado }
  /api/loans/{id}/return:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Confirmar devolución (ADMIN u OPERATOR); repetición sin auditoría duplicada
      responses:
        '200': { description: Datos persistidos }
        '400': { description: Entrada inválida }
        '401': { description: Sesión inválida }
        '403': { description: Rol insuficiente }
        '503': { description: Servicio no disponible }
  /api/reservations/{id}/cancel:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Cancelar reserva propia o por operador con bloqueo y auditoría
      responses:
        '200': { description: Datos persistidos }
        '400': { description: Entrada inválida }
        '401': { description: Sesión inválida }
        '403': { description: Rol insuficiente }
        '503': { description: Servicio no disponible }
  /api/incidents:
    get:
      summary: Últimas 50 incidencias propias; operadores consultan todas
      responses:
        '200': { description: Datos persistidos }
        '400': { description: Entrada inválida }
        '401': { description: Sesión inválida }
        '403': { description: Rol insuficiente }
        '503': { description: Servicio no disponible }
    post:
      summary: Guardar reporte antes del análisis de IA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [description]
              properties:
                description: { type: string, minLength: 15, maxLength: 4000 }
      responses:
        '201': { description: Reporte PENDING y auditoría persistidos }
        '400': { description: Descripción inválida }
        '401': { description: Sesión inválida }
  /api/incidents/{id}/triage:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Analizar con Groq; solo propietario u operador; COMPLETE se reutiliza
      responses:
        '200': { description: Clasificación y metadatos persistidos en triage; aiStatus COMPLETE }
        '401': { description: Sesión inválida }
        '404': { description: Reporte inexistente o ajeno }
        '409': { description: Análisis en curso; lease recuperable tras 60 segundos }
        '429': { description: Ocho análisis por usuario por minuto }
        '503': { description: Reporte conservado; aiStatus FAILED con código seguro y reintento }
  /api/incidents/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Actualizar atención del reporte (ADMIN u OPERATOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED] }
      responses:
        '200': { description: Datos persistidos }
        '400': { description: Entrada inválida }
        '401': { description: Sesión inválida }
        '403': { description: Rol insuficiente }
        '503': { description: Servicio no disponible }

  /api/agenda/assistant:
    post:
      summary: Asistente de agenda con n8n e IA (ADMIN u OPERATOR)
      description: >-
        n8n interpreta el texto con IA y un motor determinista decide (aforo, solapes, estado del espacio, orden de llegada).
        modo PROPUESTA nunca escribe. modo EJECUCION exige N8N_MODE=execute y aplica mediante funciones auditadas de la base;
        el cambio solo cuenta como aplicado si execution es APPLIED. El usuario sale de la sesión, nunca del body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reporte, rol]
              properties:
                reporte: { type: string, minLength: 5, maxLength: 4000 }
                rol: { type: string, enum: [DOCENTE, COMERCIAL, ADMINISTRATIVO] }
                modo: { type: string, enum: [PROPUESTA, EJECUCION], default: PROPUESTA }
                fecha: { type: string, format: date }
                salaActual: { type: string, minLength: 1, maxLength: 80 }
                asistentes: { type: integer, minimum: 1, maximum: 100 }
                horaInicio: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
                horaFinSolicitada: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
      responses:
        '200': { description: 'Decisión, estado de las salas leído de la base y execution (APPLIED, NOT_APPLIED, NO_CHANGES o NOT_REPORTED)' }
        '400': { description: Campos inválidos }
        '403': { description: Requiere ADMIN u OPERATOR }
        '409': { description: Aplicación directa desactivada (N8N_MODE distinto de execute) }
        '502': { description: Respuesta de n8n fuera del contrato; no se aplicó nada }
        '503': { description: n8n o la IA no disponibles; no se aplicó nada }
  /api/calendar/proposals:
    post:
      summary: Propuesta n8n (ADMIN u OPERATOR), sin ejecutar cambios
      description: Requiere webhook configurado en modo propuesta. El rol de negocio del body no concede permisos. Usuario deriva de sesión. Ver docs/n8n-integration.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reporte, rol, fecha, salaActual, asistentes, horaInicio, horaFinSolicitada]
              properties:
                reporte: { type: string, minLength: 15, maxLength: 4000 }
                rol: { type: string, enum: [DOCENTE, COMERCIAL, ADMINISTRATIVO] }
                fecha: { type: string, format: date }
                salaActual: { type: string, minLength: 1, maxLength: 80 }
                asistentes: { type: integer, minimum: 1, maximum: 100 }
                horaInicio: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
                horaFinSolicitada: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
      responses:
        '200': { description: Propuesta validada con execution NOT_APPLIED y advertencias }
        '400': { description: Campos o intervalo inválidos }
        '401': { description: Sesión inválida }
        '403': { description: Requiere operador }
        '409': { description: Espacio sin habilitar o aforo excedido }
        '502': { description: JSON n8n inválido o catálogo incoherente }
        '503': { description: Webhook sin configurar o no disponible }
  /api/channels:
    get:
      summary: Lista canales de comunicación del campus
      description: Retorna los canales temáticos por área y el canal de avisos oficiales con el conteo de mensajes recientes.
      responses:
        '200':
          description: Canales ordenados (avisos oficiales primero)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunicationChannel'
        '401': { description: Sesión ausente o inválida }
  /api/channels/{slug}/messages:
    get:
      summary: Historial de mensajes de un canal
      description: Retorna hasta 50 mensajes recientes en orden cronológico ascendente.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Mensajes del canal con datos del remitente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelMessage'
        '401': { description: Sesión ausente o inválida }
        '404': { description: Canal no encontrado }
  /api/members:
    get:
      summary: Directorio de miembros del campus
      description: Retorna la lista de miembros registrados con su nombre, correo y área para autocompletado de menciones.
      responses:
        '200':
          description: Lista de miembros activos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberProfile'
        '401': { description: Sesión ausente o inválida }
  /api/admin/users:
    get:
      summary: Lista todos los usuarios con roles para administración
      description: Solo disponible para el rol ADMIN.
      responses:
        '200':
          description: Lista completa de perfiles
        '401': { description: Sesión ausente o inválida }
        '403': { description: Requiere rol ADMIN }
  /api/admin/users/{id}/role:
    patch:
      summary: Reasigna el área/rol de un usuario
      description: Solo disponible para ADMIN. Permite modificar el área a cualquiera de los roles válidos.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200': { description: Rol actualizado exitosamente }
        '400': { description: Rol no reconocido }
        '401': { description: Sesión ausente o inválida }
        '403': { description: Requiere rol ADMIN }
        '404': { description: Usuario no encontrado }

